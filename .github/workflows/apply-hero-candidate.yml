name: Apply Hero candidate

on:
  push:
    branches:
      - agent/home-hero-stabilization-001
    paths:
      - '.hero-candidate.ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-hero-stabilization-001
          fetch-depth: 0

      - name: Extract candidate
        run: |
          cat .hero-candidate.part-* | base64 --decode > /tmp/hero-candidate.tar.gz
          rm -rf \
            resources/css/pages/welcome-hero \
            resources/css/pages/welcome-hero-motion.css \
            resources/css/pages/welcome-hero-visual.css \
            resources/js/pages/welcome-hero \
            resources/views/partials/home-hero-copy-layout.blade.php
          tar -xzf /tmp/hero-candidate.tar.gz -C .
          rm -f .hero-candidate.part-* .hero-candidate.ready .github/workflows/apply-hero-candidate.yml

      - name: Static candidate proof
        run: |
          git diff --check
          node --check resources/js/pages/welcome-hero.js
          node --check resources/js/pages/welcome/navigation.js
          node --check resources/js/pages/welcome/navigation-mega.js
          node --check resources/js/surfaces/home/hero/controller.js
          node --check resources/js/surfaces/home/hero/events.js
          node --check resources/js/surfaces/home/hero/media.js
          node --check scripts/hero-bundle-report.mjs
          node --check scripts/hero-runtime-proof.mjs
          node --check scripts/verify-source-structure.mjs
          php -l app/Http/Controllers/Concerns/BuildsHomeHero.php
          php -l tests/Feature/HomeHeroTest.php
          php -l tests/Feature/HomeHeroStabilizationTest.php
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const roots = [
            'app/Http/Controllers/Concerns/BuildsHomeHero.php',
            'resources/views/home/sections/hero.blade.php',
            'resources/views/partials/language-flag.blade.php',
            'resources/views/partials/site-navbar.blade.php',
            'resources/css/pages/welcome-hero.css',
            'resources/css/pages/welcome-navigation.css',
            'resources/css/pages/welcome-navigation',
            'resources/css/surfaces/home/hero',
            'resources/js/pages/welcome-hero.js',
            'resources/js/pages/welcome/navigation.js',
            'resources/js/pages/welcome/navigation-mega.js',
            'resources/js/surfaces/home/hero',
            'tests/Feature/HomeHeroTest.php',
            'tests/Feature/HomeHeroStabilizationTest.php',
            'scripts/hero-bundle-report.mjs',
            'scripts/hero-runtime-proof.mjs',
            'scripts/verify-source-structure.mjs',
          ];
          const files = [];
          function collect(target) {
            const stat = fs.statSync(target);
            if (stat.isDirectory()) {
              for (const entry of fs.readdirSync(target)) collect(path.join(target, entry));
              return;
            }
            files.push(target);
          }
          roots.forEach(collect);
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const lines = source ? source.split('\n').length - (source.endsWith('\n') ? 1 : 0) : 0;
            if (lines > 200) throw new Error(`${file} has ${lines} lines`);
          }
          console.log(`Candidate line proof passed: ${files.length} files.`);
          NODE

      - name: Commit candidate
        run: |
          git config user.name 'SchoolAI Hero Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: stabilize homepage hero surface'
          git push origin HEAD:agent/home-hero-stabilization-001
