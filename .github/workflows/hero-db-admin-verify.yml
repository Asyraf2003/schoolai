name: Verify hero database admin implementation

on:
  push:
    branches: [agent/hero-db-admin-verify]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-and-squash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hero-db-admin-verify

      - name: Mark verification runner start
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$GITHUB_RUN_ID" > .github/hero-verification-started
          git add .github/hero-verification-started
          git commit -m "chore: mark hero verification start"
          git push origin HEAD:agent/hero-db-admin-verify

      - name: Apply implementation patch
        shell: bash
        run: |
          apply_hero_patch() {
            cat .github/hero-db-admin.patch.gz.b64.part* | base64 --decode | gunzip > /tmp/hero-db-admin.patch
            git apply --check /tmp/hero-db-admin.patch
            git apply /tmp/hero-db-admin.patch
            rm .github/hero-db-admin.patch.gz.b64.part*
            rm .github/hero-verification-started
            rm -f .github/hero-verification-error.txt
            rm -f .github/hero-verification-test-error.txt
            rm -f .github/hero-verification-suite-error.txt
            rm -f .github/hero-verification-build-error.txt
            rm .github/workflows/hero-db-admin-verify.yml
            git diff --check
          }

          set +e
          apply_hero_patch > /tmp/hero-apply.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp /tmp/hero-apply.log .github/hero-verification-error.txt
            git add -f .github/hero-verification-error.txt
            git commit -m "chore: capture hero verification apply error"
            git push origin HEAD:agent/hero-db-admin-verify
            cat /tmp/hero-apply.log
            exit "$status"
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          rm -f database/database.sqlite
          touch database/database.sqlite

      - name: Verify migrations
        run: php artisan migrate:fresh --force

      - name: Run focused hero tests
        shell: bash
        run: |
          set +e
          php artisan test tests/Feature/HomeHeroTest.php tests/Feature/Admin/HeroSlideAdminTest.php > /tmp/hero-focused-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp /tmp/hero-focused-tests.log .github/hero-verification-test-error.txt
            git add -f .github/hero-verification-test-error.txt
            git commit -m "chore: capture hero focused test failure"
            git push origin HEAD:agent/hero-db-admin-verify
            cat /tmp/hero-focused-tests.log
            exit "$status"
          fi
          cat /tmp/hero-focused-tests.log

      - name: Run Laravel regression suite
        shell: bash
        run: |
          set +e
          php artisan test > /tmp/hero-regression-suite.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp /tmp/hero-regression-suite.log .github/hero-verification-suite-error.txt
            git add -f .github/hero-verification-suite-error.txt
            git commit -m "chore: capture hero regression test failure"
            git push origin HEAD:agent/hero-db-admin-verify
            cat /tmp/hero-regression-suite.log
            exit "$status"
          fi
          cat /tmp/hero-regression-suite.log

      - name: Build frontend assets
        shell: bash
        run: |
          set +e
          npm run build > /tmp/hero-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git clean -fd
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp /tmp/hero-build.log .github/hero-verification-build-error.txt
            git add -f .github/hero-verification-build-error.txt
            git commit -m "chore: capture hero frontend build failure"
            git push origin HEAD:agent/hero-db-admin-verify
            cat /tmp/hero-build.log
            exit "$status"
          fi
          cat /tmp/hero-build.log

      - name: Squash verified implementation into one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft d549247fb2a6727dfa16e5a3babe0d7fded36104
          git add -A
          git diff --cached --check
          git commit -m "feat: manage homepage hero slides from admin"
          git push --force origin HEAD:agent/hero-db-admin-verify
