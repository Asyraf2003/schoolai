name: Verify hero database admin implementation

on:
  push:
    branches: [agent/hero-db-admin-verify]

permissions:
  contents: write

concurrency:
  group: hero-db-admin-verify
  cancel-in-progress: true

jobs:
  verify-and-squash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/hero-db-admin-verify

      - name: Apply implementation patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rev-parse HEAD > /tmp/hero-verification-branch-head

          apply_hero_patch() {
            cat .github/hero-db-admin.patch.gz.b64.part* | base64 --decode | gunzip > /tmp/hero-db-admin.patch
            printf 'PATCH_BYTES=' && wc -c < /tmp/hero-db-admin.patch
            git apply --check /tmp/hero-db-admin.patch
            git apply /tmp/hero-db-admin.patch
            grep -Fq "falls back to the locale hero contract" tests/Feature/HomeHeroTest.php
            test -f tests/Feature/Admin/HeroSlideAdminTest.php
            printf 'HOME_HERO_TEST_UPDATED=yes\n'
            printf 'ADMIN_HERO_TEST_PRESENT=yes\n'
            rm .github/hero-db-admin.patch.gz.b64.part*
            rm -f .github/hero-verification-started
            rm -f .github/hero-verification-error.txt
            rm -f .github/hero-verification-composer-error.txt
            rm -f .github/hero-verification-test-error.txt
            rm -f .github/hero-verification-suite-error.txt
            rm -f .github/hero-verification-build-error.txt
            rm .github/workflows/hero-db-admin-verify.yml
            git diff --check
            git add -A
            git commit -m "chore: materialize hero implementation for verification"
          }

          set +e
          apply_hero_patch > /tmp/hero-apply.log 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            git reset --hard "$(cat /tmp/hero-verification-branch-head)"
            git clean -fd
            cp /tmp/hero-apply.log .github/hero-verification-error.txt
            git add -f .github/hero-verification-error.txt
            git commit -m "chore: capture hero verification apply error [skip ci]"
            git push origin HEAD:agent/hero-db-admin-verify
            cat /tmp/hero-apply.log
            exit "$status"
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        shell: bash
        run: |
          set +e
          composer install --no-interaction --prefer-dist --no-progress > /tmp/hero-composer.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard "$(cat /tmp/hero-verification-branch-head)"
            git clean -fd
            cp /tmp/hero-composer.log .github/hero-verification-composer-error.txt
            git add -f .github/hero-verification-composer-error.txt
            git commit -m "chore: capture hero composer verification failure [skip ci]"
            git push origin HEAD:agent/hero-db-admin-verify
            cat /tmp/hero-composer.log
            exit "$status"
          fi
          cat /tmp/hero-composer.log

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        shell: bash
        run: |
          set +e
          npm run build > /tmp/hero-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard "$(cat /tmp/hero-verification-branch-head)"
            git clean -fd
            cp /tmp/hero-build.log .github/hero-verification-build-error.txt
            git add -f .github/hero-verification-build-error.txt
            git commit -m "chore: capture hero frontend build failure [skip ci]"
            git push origin HEAD:agent/hero-db-admin-verify
            cat /tmp/hero-build.log
            exit "$status"
          fi
          cat /tmp/hero-build.log

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          rm -f database/database.sqlite
          touch database/database.sqlite

      - name: Verify migrations
        run: php artisan migrate:fresh --force

      - name: Run focused hero tests
        shell: bash
        run: |
          set +e
          {
            grep -Fq "falls back to the locale hero contract" tests/Feature/HomeHeroTest.php || { echo 'HOME_HERO_TEST_REVERTED'; exit 91; }
            test -f tests/Feature/Admin/HeroSlideAdminTest.php || { echo 'ADMIN_HERO_TEST_MISSING'; exit 92; }
            git diff --quiet HEAD -- tests/Feature/HomeHeroTest.php tests/Feature/Admin/HeroSlideAdminTest.php || { echo 'HERO_TESTS_NOT_COMMITTED'; exit 93; }
            printf '%s\n' '--- HOME HERO TEST HASH ---'
            sha256sum tests/Feature/HomeHeroTest.php
            printf '%s\n' '--- ADMIN HERO TEST HASH ---'
            sha256sum tests/Feature/Admin/HeroSlideAdminTest.php
            printf '%s\n' '--- HOME HERO TEST DEFINITIONS ---'
            grep -n "^it(" tests/Feature/HomeHeroTest.php
            printf '%s\n' '--- ADMIN HERO TEST DEFINITIONS ---'
            grep -n "^it(" tests/Feature/Admin/HeroSlideAdminTest.php
            printf '%s\n' '--- PEST VERSION ---'
            ./vendor/bin/pest --version
            ./vendor/bin/pest tests/Feature/HomeHeroTest.php --do-not-cache-result
            ./vendor/bin/pest tests/Feature/Admin/HeroSlideAdminTest.php --do-not-cache-result
          } > /tmp/hero-focused-tests.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard "$(cat /tmp/hero-verification-branch-head)"
            git clean -fd
            cp /tmp/hero-focused-tests.log .github/hero-verification-test-error.txt
            git add -f .github/hero-verification-test-error.txt
            git commit -m "chore: capture hero focused test failure [skip ci]"
            git push origin HEAD:agent/hero-db-admin-verify
            cat /tmp/hero-focused-tests.log
            exit "$status"
          fi
          cat /tmp/hero-focused-tests.log

      - name: Run Laravel regression suite
        shell: bash
        run: |
          set +e
          ./vendor/bin/pest --do-not-cache-result > /tmp/hero-regression-suite.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git reset --hard "$(cat /tmp/hero-verification-branch-head)"
            git clean -fd
            cp /tmp/hero-regression-suite.log .github/hero-verification-suite-error.txt
            git add -f .github/hero-verification-suite-error.txt
            git commit -m "chore: capture hero regression test failure [skip ci]"
            git push origin HEAD:agent/hero-db-admin-verify
            cat /tmp/hero-regression-suite.log
            exit "$status"
          fi
          cat /tmp/hero-regression-suite.log

      - name: Squash verified implementation into one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft d549247fb2a6727dfa16e5a3babe0d7fded36104
          git add -A
          git diff --cached --check
          git commit -m "feat: manage homepage hero slides from admin"
          git push --force origin HEAD:agent/hero-db-admin-verify
