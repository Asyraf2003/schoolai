name: Login choice proof

on:
  push:
    branches: [ai/login-choice-page-20260802]

permissions:
  contents: read

jobs:
  focused-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Check touched PHP formatting
        run: |
          vendor/bin/pint --test \
            app/Http/Controllers/Auth/LoginController.php \
            routes/web/auth.php \
            lang/id/app.php \
            lang/en/app.php \
            lang/ar/app.php \
            tests/Feature/PublicAuthAndPpdbAccessTest.php

      - name: Build frontend assets
        run: npm run build

      - name: Run focused public auth test
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test tests/Feature/PublicAuthAndPpdbAccessTest.php

      - name: Run auth regression tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan test tests/Feature/Auth tests/Feature/TranslationParityTest.php
