name: V2 heading and three Values strokes focus

on:
  pull_request:
    paths:
      - 'resources/js/sections/section-heading.js'
      - 'resources/js/sections/program-heading.js'
      - 'resources/js/sections/values-heading.js'
      - 'resources/js/sections/values-line*.js'
      - 'resources/css/sections/program-reveal.css'
      - 'resources/css/sections/values.css'
      - 'resources/views/landing/values-line.blade.php'
      - 'tests/Unit/ProgramHeadingSequenceBrowser.test.mjs'
      - 'tests/Unit/ValuesHeadingLifecycleBrowser.test.mjs'
      - 'tests/Unit/ValuesLine*.mjs'
      - '.github/workflows/v2-heading-line-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-motion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run check:structure
      - run: npm run build
      - run: node --test tests/Unit/ValuesLineGeometry.test.mjs
      - name: Prepare Laravel and browser
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate:fresh --seed --force
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps ${{ matrix.engine }}
          curl -fL https://cdn.jsdelivr.net/npm/gsap@3.7.1/dist/gsap.min.js -o /tmp/gsap.min.js
          curl -fL https://cdn.jsdelivr.net/npm/gsap@3.7.1/dist/ScrollTrigger.min.js -o /tmp/ScrollTrigger.min.js
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*/chrome-linux*/*' -print -quit)"
          if [ -n "$CHROME" ]; then echo "PROGRAM_CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"; fi
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/heading-line-server.log 2>&1 &
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/heading-line-server.log
          exit 1
      - name: Verify heading and three strokes
        env:
          PROGRAM_BROWSER_URL: http://127.0.0.1:8000
          PROGRAM_PLAYWRIGHT_MODULE: playwright
          PROGRAM_ENGINES: ${{ matrix.engine }}
          PROGRAM_GSAP_FIXTURE: /tmp/gsap.min.js
          PROGRAM_SCROLLTRIGGER_FIXTURE: /tmp/ScrollTrigger.min.js
          PROGRAM_PROOF_DIRECTORY: /tmp
        run: >-
          node --test --test-concurrency=1 --test-timeout=420000
          tests/Unit/ProgramHeadingSequenceBrowser.test.mjs
          tests/Unit/ValuesHeadingLifecycleBrowser.test.mjs
          tests/Unit/ValuesLineBrowser.test.mjs
          tests/Unit/ValuesLineRenderBrowser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heading-lines-${{ matrix.engine }}
          path: |
            /tmp/values-three-line-*.json
            /tmp/values-three-line-*.png
            /tmp/heading-line-server.log
