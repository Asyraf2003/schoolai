name: Verify clean hero database admin implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: hero-db-admin-clean-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - name: Check out clean verification branch
        uses: actions/checkout@v4
        with:
          ref: agent/hero-db-admin-clean
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Apply hero implementation
        shell: bash
        run: |
          set +e
          {
            cat .github/hero-db-admin.patch.gz.b64.part* | base64 --decode | gunzip > /tmp/hero-db-admin.patch
            echo "PATCH_BYTES=$(wc -c < /tmp/hero-db-admin.patch)"
            git apply --check /tmp/hero-db-admin.patch
            git apply /tmp/hero-db-admin.patch
            grep -Fq "falls back to the locale hero contract" tests/Feature/HomeHeroTest.php
            test -f tests/Feature/Admin/HeroSlideAdminTest.php
            git diff --check
          } > /tmp/hero-clean-apply.log 2>&1
          status=$?
          set -e
          cat /tmp/hero-clean-apply.log
          exit "$status"

      - name: Upload apply evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-clean-apply-${{ github.run_id }}
          path: /tmp/hero-clean-apply.log
          if-no-files-found: ignore

      - name: Recreate SQLite database
        run: |
          rm -f database/database.sqlite
          touch database/database.sqlite

      - name: Verify implementation after SQLite recreation
        run: |
          grep -Fq "falls back to the locale hero contract" tests/Feature/HomeHeroTest.php
          test -f tests/Feature/Admin/HeroSlideAdminTest.php

      - name: Verify migrations
        run: php artisan migrate:fresh --force

      - name: Verify implementation after migrations
        run: |
          grep -Fq "falls back to the locale hero contract" tests/Feature/HomeHeroTest.php
          test -f tests/Feature/Admin/HeroSlideAdminTest.php

      - name: Run focused hero tests
        shell: bash
        run: |
          set +e
          {
            ./vendor/bin/pest tests/Feature/HomeHeroTest.php --do-not-cache-result
            ./vendor/bin/pest tests/Feature/Admin/HeroSlideAdminTest.php --do-not-cache-result
          } > /tmp/hero-focused-tests.log 2>&1
          status=$?
          set -e
          cat /tmp/hero-focused-tests.log
          exit "$status"

      - name: Upload focused hero test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-clean-focused-tests-${{ github.run_id }}
          path: /tmp/hero-focused-tests.log
          if-no-files-found: ignore

      - name: Run Laravel regression suite
        shell: bash
        run: |
          set +e
          ./vendor/bin/pest --do-not-cache-result > /tmp/hero-regression-suite.log 2>&1
          status=$?
          set -e
          cat /tmp/hero-regression-suite.log
          exit "$status"

      - name: Upload Laravel regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hero-clean-regression-${{ github.run_id }}
          path: /tmp/hero-regression-suite.log
          if-no-files-found: ignore

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/hero-db-admin.patch.gz.b64.part*
          rm .github/workflows/hero-db-admin-clean-verify.yml
          git diff --check
          git add -A
          git commit -m "feat: manage homepage hero slides from admin"
          git push --force origin HEAD:agent/hero-db-admin-clean
