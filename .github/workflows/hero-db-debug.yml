name: Debug hero verification file stability

on:
  pull_request:
    branches: [main]

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hero-db-admin-verify
          fetch-depth: 0

      - name: Apply patch and capture expected hashes
        run: |
          cat .github/hero-db-admin.patch.gz.b64.part* | base64 --decode | gunzip > /tmp/hero-db-admin.patch
          git apply --check /tmp/hero-db-admin.patch
          git apply /tmp/hero-db-admin.patch
          grep -Fq "falls back to the locale hero contract" tests/Feature/HomeHeroTest.php
          test -f tests/Feature/Admin/HeroSlideAdminTest.php
          sha256sum tests/Feature/HomeHeroTest.php | cut -d' ' -f1 > /tmp/home-hero.sha
          sha256sum tests/Feature/Admin/HeroSlideAdminTest.php | cut -d' ' -f1 > /tmp/admin-hero.sha

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Verify before Laravel setup
        run: |
          test "$(sha256sum tests/Feature/HomeHeroTest.php | cut -d' ' -f1)" = "$(cat /tmp/home-hero.sha)"
          test "$(sha256sum tests/Feature/Admin/HeroSlideAdminTest.php | cut -d' ' -f1)" = "$(cat /tmp/admin-hero.sha)"

      - name: Copy environment
        run: cp .env.example .env

      - name: Verify after environment copy
        run: |
          test "$(sha256sum tests/Feature/HomeHeroTest.php | cut -d' ' -f1)" = "$(cat /tmp/home-hero.sha)"
          test "$(sha256sum tests/Feature/Admin/HeroSlideAdminTest.php | cut -d' ' -f1)" = "$(cat /tmp/admin-hero.sha)"

      - name: Generate application key
        run: php artisan key:generate

      - name: Verify after key generation
        run: |
          test "$(sha256sum tests/Feature/HomeHeroTest.php | cut -d' ' -f1)" = "$(cat /tmp/home-hero.sha)"
          test "$(sha256sum tests/Feature/Admin/HeroSlideAdminTest.php | cut -d' ' -f1)" = "$(cat /tmp/admin-hero.sha)"

      - name: Clear configuration
        run: php artisan config:clear

      - name: Verify after config clear
        run: |
          test "$(sha256sum tests/Feature/HomeHeroTest.php | cut -d' ' -f1)" = "$(cat /tmp/home-hero.sha)"
          test "$(sha256sum tests/Feature/Admin/HeroSlideAdminTest.php | cut -d' ' -f1)" = "$(cat /tmp/admin-hero.sha)"

      - name: Recreate SQLite file
        run: |
          rm -f database/database.sqlite
          touch database/database.sqlite

      - name: Verify after SQLite recreation
        run: |
          test "$(sha256sum tests/Feature/HomeHeroTest.php | cut -d' ' -f1)" = "$(cat /tmp/home-hero.sha)"
          test "$(sha256sum tests/Feature/Admin/HeroSlideAdminTest.php | cut -d' ' -f1)" = "$(cat /tmp/admin-hero.sha)"

      - name: Run migrations
        run: php artisan migrate:fresh --force

      - name: Verify after migrations
        run: |
          echo "HOME=$(sha256sum tests/Feature/HomeHeroTest.php | cut -d' ' -f1)"
          echo "ADMIN=$(sha256sum tests/Feature/Admin/HeroSlideAdminTest.php | cut -d' ' -f1)"
          grep -Fq "falls back to the locale hero contract" tests/Feature/HomeHeroTest.php
          test -f tests/Feature/Admin/HeroSlideAdminTest.php
          test "$(sha256sum tests/Feature/HomeHeroTest.php | cut -d' ' -f1)" = "$(cat /tmp/home-hero.sha)"
          test "$(sha256sum tests/Feature/Admin/HeroSlideAdminTest.php | cut -d' ' -f1)" = "$(cat /tmp/admin-hero.sha)"
