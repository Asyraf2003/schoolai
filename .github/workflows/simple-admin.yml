name: Simple admin and database regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, fileinfo, pdo_sqlite, gd, intl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: npm run check:structure
      - run: npm run build
      - name: Verify Laravel behavior
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan test --compact
      - name: Prepare isolated browser fixtures
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          SESSION_DRIVER: database
        run: |
          php artisan migrate --force
          php artisan db:seed --class='Tests\Fixtures\BrowserContentSeeder' --force
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps ${{ matrix.engine }}
          node --input-type=module -e 'import {chromium} from "playwright"; console.log("PROGRAM_CHROMIUM_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/simple-admin-server.log 2>&1 &
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/simple-admin-server.log
          exit 1
      - name: Verify six tiers, locale, forms and PPDB
        env:
          SCHOOLAI_BROWSER_URL: http://127.0.0.1:8000
          PROGRAM_PLAYWRIGHT_MODULE: playwright
          PROGRAM_ENGINES: ${{ matrix.engine }}
          PROGRAM_PROOF_DIRECTORY: /tmp
        run: node --test --test-concurrency=1 --test-timeout=240000 tests/Unit/SimpleAdminBrowser.test.mjs tests/Unit/PublicContentBrowser.test.mjs tests/Unit/R2MediaBrowser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simple-admin-${{ matrix.engine }}
          path: |
            /tmp/simple-admin-*.json
            /tmp/simple-admin-*.png
            /tmp/simple-admin-server.log
            /tmp/public-content-*.json
            /tmp/public-content-*.png
            /tmp/r2-media-*.json
